<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Panel de Producción — AR2200</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15181A;
    --panel:#1F2325;
    --panel-2:#262B2D;
    --line:#343B3D;
    --line-soft:#2A3032;
    --ink:#EDEDE3;
    --muted:#8B9296;
    --muted-2:#5F6668;
    --yellow:#F2B807;
    --yellow-ink:#3A2C00;
    --blue:#3E8FB0;
    --green:#4CAF6E;
    --red:#E1503D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',"Arial Narrow",sans-serif;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,'Courier New',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--yellow);color:var(--yellow-ink);}

  /* ---------- layout shell ---------- */
  #app{max-width:1100px;margin:0 auto;padding:0 0 60px;}

  header.top{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg) 80%,transparent);
    padding:16px 16px 0;
  }
  .hazard-rule{
    height:4px;width:100%;
    background:repeating-linear-gradient(135deg,var(--yellow) 0 10px,#1B1E1F 10px 20px);
    border-radius:2px;
    margin-top:12px;
    opacity:.9;
  }
  .top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  }
  .brand h1{font-size:26px;margin:0;line-height:1;font-weight:600;}
  .brand h1 span{color:var(--yellow);}
  .sync{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(76,175,110,.15);}
  .sync-dot.stale{background:var(--muted-2);box-shadow:none;}
  .sync-dot.err{background:var(--red);box-shadow:0 0 0 3px rgba(225,80,61,.18);}
  .btn{
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,background .15s;
  }
  .btn:hover{border-color:var(--muted-2);}
  .btn.ghost{background:transparent;}
  .btn.small{padding:6px 10px;font-size:12px;}
  .btn:active{transform:translateY(1px);}

  /* ---------- KPI strip ---------- */
  .kpis{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    margin:16px 0 6px;
  }
  .kpi{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:12px 14px;
  }
  .kpi .n{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;line-height:1;}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.04em;text-transform:uppercase;}
  .kpi.warn .n{color:var(--yellow);}
  .kpi.good .n{color:var(--green);}

  /* ---------- filters ---------- */
  .filters{
    display:flex;gap:8px;align-items:center;margin:18px 16px 0;flex-wrap:wrap;
  }
  .search{
    flex:1;min-width:180px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;color:var(--ink);font-size:14px;
  }
  .search::placeholder{color:var(--muted-2);}
  .toggle{
    display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;
    user-select:none;
  }
  .toggle input{accent-color:var(--yellow);width:16px;height:16px;}
  select.sortsel{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    padding:9px 10px;font-size:13px;
  }

  /* ---------- process tabs ---------- */
  .tabs-wrap{margin:14px 0 4px;padding:0 16px;}
  .tabs{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;
    scrollbar-width:thin;
  }
  .tabs::-webkit-scrollbar{height:4px;}
  .tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
  .tab{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:var(--panel);
    border-radius:999px;padding:8px 14px 8px 14px;
    font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;
  }
  .tab.active{border-color:var(--yellow);color:var(--ink);background:var(--panel-2);}
  .tab .badge{
    background:var(--line-soft);color:var(--muted);border-radius:999px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:1px 7px;
  }
  .tab.active .badge{background:var(--yellow);color:var(--yellow-ink);}
  .tab .badge.zero{opacity:.45;}

  /* ---------- groups & cards ---------- */
  .group{margin:22px 16px 0;}
  .group-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding-bottom:8px;border-bottom:1px solid var(--line-soft);margin-bottom:10px;
    cursor:pointer;
  }
  .group-head h2{font-size:16px;margin:0;font-weight:500;color:var(--ink);}
  .group-head .meta{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .group-bar{
    height:4px;border-radius:2px;background:var(--line-soft);overflow:hidden;margin-top:8px;
  }
  .group-bar > i{display:block;height:100%;background:var(--blue);}
  .cards{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;
  }
  .card{
    position:relative;
    background:var(--panel);border:1px solid var(--line-soft);border-left:4px solid var(--muted-2);
    border-radius:var(--radius);padding:12px 13px 11px;
    overflow:hidden;
  }
  .card.st-pendiente{border-left-color:var(--yellow);}
  .card.st-progreso{border-left-color:var(--blue);}
  .card.st-completo{border-left-color:var(--green);opacity:.72;}
  .card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .card-prio{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
    display:flex;align-items:center;gap:5px;
  }
  .card-prio .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;border:1px solid var(--line);
    font-size:10px;color:var(--muted);
  }
  .card-status{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;}
  .card-status.pendiente{background:rgba(242,184,7,.15);color:var(--yellow);}
  .card-status.progreso{background:rgba(62,143,176,.18);color:var(--blue);}
  .card-status.completo{background:rgba(76,175,110,.15);color:var(--green);}
  .card-desc{font-size:13.5px;font-weight:600;margin:8px 0 2px;line-height:1.3;}
  .card-code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .card-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;}
  .card-qty{color:var(--muted);}
  .card-qty b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}
  .card-pct{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;}
  .bar{height:5px;border-radius:3px;background:var(--line-soft);margin-top:6px;overflow:hidden;}
  .bar > i{display:block;height:100%;}
  .card-foot{
    display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;
    border-top:1px dashed var(--line-soft);font-size:11px;color:var(--muted);
  }
  .card-foot span b{color:var(--muted);font-weight:600;}

  .empty{
    text-align:center;color:var(--muted);padding:40px 20px;font-size:13px;
  }

  /* ---------- process extras: reparto de sierra / validación pintura ---------- */
  .extra-panel{
    margin:18px 16px 0;background:var(--panel);border:1px solid var(--line-soft);
    border-radius:var(--radius);padding:14px 16px;
  }
  .extra-empty{color:var(--muted);font-size:13px;text-align:center;padding:10px;}
  .extra-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .extra-head h3{margin:0;font-size:14px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;font-family:'Inter',sans-serif;}
  .extra-hint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .saw-count-field{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .saw-count-field input{
    width:56px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    color:var(--ink);padding:5px 8px;font-family:'IBM Plex Mono',monospace;font-size:13px;
  }
  .saw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px;}
  .saw-card{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;padding:10px 11px;}
  .saw-card-top{display:flex;justify-content:space-between;align-items:baseline;}
  .saw-id{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.04em;color:var(--muted);}
  .saw-hours{font-size:12px;color:var(--blue);}
  .saw-bar{height:4px;border-radius:2px;background:var(--line-soft);margin-top:6px;overflow:hidden;}
  .saw-bar > i{display:block;height:100%;background:var(--blue);}
  .saw-items{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto;}
  .saw-items li{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);}
  .saw-items li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:68%;}
  .saw-items .empty-item{color:var(--muted-2);font-style:italic;}
  .chk-validado{
    display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);
    font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  }
  .chk-validado input{accent-color:var(--green);width:14px;height:14px;}
  .card.st-validated{opacity:.55;}
  .proc-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
  .proc-kpi{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;}
  .proc-kpi .n{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;line-height:1;}
  .proc-kpi .n .of{font-size:13px;color:var(--muted);font-weight:500;}
  .proc-kpi .l{font-size:10.5px;color:var(--muted);margin-top:4px;letter-spacing:.03em;text-transform:uppercase;}
  .proc-kpi.warn .n{color:var(--yellow);}
  .proc-kpi.good .n{color:var(--green);}
  @media (max-width:640px){
    .proc-kpis{grid-template-columns:repeat(2,1fr);}
  }

  .loadmore{display:flex;justify-content:center;margin:20px 16px 0;}

  /* ---------- setup screen ---------- */
  .setup{max-width:520px;margin:8vh auto;padding:0 20px;}
  .setup .card-setup{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:26px 24px 24px;
  }
  .setup h1{font-size:22px;margin:0 0 4px;}
  .setup p{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .field input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:11px 12px;color:var(--ink);font-size:13.5px;font-family:'IBM Plex Mono',monospace;
  }
  .field .hint{font-size:11.5px;color:var(--muted-2);margin-top:5px;}
  .setup .actions{display:flex;gap:10px;margin-top:18px;}
  .btn.primary{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);}
  .btn.primary:hover{filter:brightness(1.05);}
  .steps{margin:20px 0 0;padding:16px;background:var(--panel-2);border-radius:10px;font-size:12.5px;color:var(--muted);line-height:1.7;}
  .steps b{color:var(--ink);}
  .err-box{
    background:rgba(225,80,61,.1);border:1px solid rgba(225,80,61,.35);color:#f2a89c;
    border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:14px;
  }

  .footer-note{
    text-align:center;color:var(--muted-2);font-size:11px;margin:36px 16px 0;
  }

  @media (max-width:640px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .brand h1{font-size:21px;}
    .cards{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

/* ============================================================
   CONFIG / STORAGE
   ============================================================ */
const DEFAULT_SHEET_NAME = "REGISTRO PRODUCCION";
const AUTO_REFRESH_MS = 5 * 60 * 1000;

/* Para dejar la app ya conectada al desplegarla (opcional):
   completá estos dos valores y el panel arranca directo, sin pantalla de configuración.
   Igual se puede cambiar en cualquier momento desde el botón ⚙ del panel. */
const HARDCODED_SHEET_ID = "";
const HARDCODED_SHEET_NAME = "";

const STORAGE_KEY = "panel_produccion_config";

let config = { sheetId:HARDCODED_SHEET_ID, sheetName:HARDCODED_SHEET_NAME || DEFAULT_SHEET_NAME };
let rawRows = [];
let lastSync = null;
let syncError = null;
let loading = false;
let demoMode = false;

let ui = {
  view:"setup", // setup | dashboard
  proceso:"__ALL__",
  search:"",
  onlyPending:true,
  sort:"prioridad",
  expandedGroups:{},
  visibleCount:60,
  hideValidated:false
};

/* Validación manual de pintura — marca LOCAL al dispositivo (localStorage),
   no se escribe en la planilla ni se comparte entre dispositivos. */
const VALID_KEY = "panel_validaciones_pintura";
let validations = {};
function rowKey(r){
  return [r.modulo, r.proceso, r.cod1||r.cod2||r.producto||"", r.descripcion||""].join("||");
}
function loadValidations(){
  try{ validations = JSON.parse(localStorage.getItem(VALID_KEY) || "{}"); }
  catch(e){ validations = {}; }
}
function saveValidations(){
  try{ localStorage.setItem(VALID_KEY, JSON.stringify(validations)); }catch(e){}
}
function isValidated(r){ return !!validations[rowKey(r)]; }
function toggleValidatedKey(key){
  if(validations[key]) delete validations[key];
  else validations[key] = {ts:Date.now()};
  saveValidations();
}

/* Reparto sugerido de sierra — cantidad de sierras disponibles, persistida local */
const SAW_KEY = "panel_sierra_count";
let sierraCount = 5;
function loadSierraCount(){
  try{ const v = parseInt(localStorage.getItem(SAW_KEY)); if(v>0) sierraCount = v; }catch(e){}
}
function saveSierraCount(){
  try{ localStorage.setItem(SAW_KEY, String(sierraCount)); }catch(e){}
}
function computeSawDistribution(rows, n){
  const saws = Array.from({length:n}, (_,i)=>({id:i+1, items:[], horas:0}));
  const sorted = rows.slice().sort((a,b)=> (b.horasTotales - a.horasTotales) || (a.prioridad - b.prioridad));
  sorted.forEach(r=>{
    saws.sort((a,b)=>a.horas-b.horas);
    const restante = (r.horasTotales||0) * Math.max(1-Math.min(r.avance,1),0.15);
    saws[0].items.push(r);
    saws[0].horas += restante;
  });
  saws.sort((a,b)=>a.id-b.id);
  return saws;
}

/* ============================================================
   STORAGE HELPERS
   Persistencia en el navegador (localStorage) — funciona en cualquier
   hosting (Vercel, GitHub Pages, etc). Se puede sobreescribir por URL:
   ?sheetId=XXXX&sheet=NOMBRE (útil para dejar un acceso directo en un
   celular/tablet del taller apuntado a una hoja específica).
   ============================================================ */
async function loadConfig(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      config = Object.assign(config, JSON.parse(saved));
    }
  }catch(e){ /* localStorage no disponible o sin datos */ }

  try{
    const params = new URLSearchParams(window.location.search);
    if(params.get('sheetId')) config.sheetId = params.get('sheetId');
    if(params.get('sheet')) config.sheetName = params.get('sheet');
  }catch(e){ /* ignore */ }
}
async function saveConfig(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(config)); }
  catch(e){ console.error('no se pudo guardar config', e); }
}

/* ============================================================
   HEADER NORMALIZATION + FIELD MAP
   ============================================================ */
function normHeader(h){
  return (h||"")
    .toString()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"");
}

const FIELD_MAP = {
  cod1:["COD1"],
  cod2:["COD2"],
  modulo:["EQUIPOMODULO","MODULO"],
  prioridad:["PRIORIDAD"],
  proceso:["PROCESO"],
  producto:["PRODUCTO"],
  descripcion:["DESCRIPCION"],
  cantNecesaria:["CANTNECESARIA"],
  cantTotal:["CANTTOTAL"],
  pendiente:["PENDIENTE"],
  horasTotales:["HORASTOTALES"],
  avance:["AVANCE"],
  realiza:["REALIZA"],
  cliente:["CLIENTE"],
  nOT:["NOT","NROOT","NUMEROOT"],
  comentarios:["COMENTARIOSANADIRPROCESO","COMENTARIOS"]
};

function buildColumnIndex(headers){
  const normed = headers.map(normHeader);
  const idx = {};
  for(const field in FIELD_MAP){
    const candidates = FIELD_MAP[field];
    let found = -1;
    // exact match first
    for(let i=0;i<normed.length;i++){
      if(candidates.includes(normed[i])){ found = i; break; }
    }
    // fallback: contains match (skip fields prone to collision)
    if(found === -1 && !["nOT"].includes(field)){
      for(let i=0;i<normed.length;i++){
        if(candidates.some(c=>normed[i].includes(c))){ found = i; break; }
      }
    }
    idx[field] = found;
  }
  return idx;
}

/* ============================================================
   GOOGLE SHEETS (gviz) FETCH — vía JSONP
   El endpoint gviz de Google no siempre entrega los headers CORS
   necesarios para usarse con fetch()/XHR directo. La forma robusta
   de leerlo desde el navegador es inyectar un <script> con
   tqx=responseHandler (JSONP), que no depende de CORS.
   ============================================================ */
let jsonpSeq = 0;
function jsonpFetch(url, timeoutMs){
  return new Promise((resolve, reject)=>{
    const cbName = "gvizCb_" + (jsonpSeq++) + "_" + Date.now();
    const script = document.createElement('script');
    let settled = false;

    const cleanup = ()=>{
      try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    };
    const timer = setTimeout(()=>{
      if(settled) return;
      settled = true;
      cleanup();
      reject(new Error("Tiempo de espera agotado consultando Google Sheets. Revisá tu conexión o si la hoja es muy pesada."));
    }, timeoutMs || 15000);

    window[cbName] = (data)=>{
      if(settled) return;
      settled = true;
      cleanup();
      resolve(data);
    };
    script.onerror = ()=>{
      if(settled) return;
      settled = true;
      cleanup();
      reject(new Error("No se pudo cargar la hoja. Verificá el ID y que esté compartida como \"Cualquier persona con el enlace: Lector\"."));
    };
    script.src = url + (url.includes("?") ? "&" : "?") + "tqx=out:json;responseHandler:" + cbName;
    document.body.appendChild(script);
  });
}

function buildGvizUrl(sheetId, sheetName){
  const base = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/gviz/tq`;
  return `${base}?sheet=${encodeURIComponent(sheetName)}`;
}

async function fetchSheet(sheetId, sheetName){
  const url = buildGvizUrl(sheetId, sheetName);
  let json;
  try{
    json = await jsonpFetch(url);
  }catch(e){
    throw new Error(e.message || "No se pudo conectar con Google Sheets.");
  }
  if(!json || !json.table){
    throw new Error("La hoja no devolvió datos en el formato esperado. Revisá el ID y el nombre de la pestaña.");
  }
  if(json.status === "error"){
    const msg = (json.errors && json.errors[0] && json.errors[0].detailed_message) || "Error desconocido de Google Sheets.";
    throw new Error(msg);
  }
  const table = json.table;
  const headers = table.cols.map(c => c.label || c.id || "");
  const idx = buildColumnIndex(headers);

  const rows = table.rows.map(r=>{
    const cells = r.c || [];
    const get = (field)=>{
      const i = idx[field];
      if(i===-1 || i===undefined || !cells[i]) return null;
      const cell = cells[i];
      return cell.v !== undefined ? cell.v : (cell.f !== undefined ? cell.f : null);
    };
    const num = (field)=>{
      const v = get(field);
      const n = typeof v === "number" ? v : parseFloat(v);
      return isNaN(n) ? 0 : n;
    };
    return {
      cod1: get('cod1') || "",
      cod2: get('cod2') || "",
      modulo: (get('modulo') || "SIN MÓDULO").toString().trim(),
      prioridad: (()=>{ const v=get('prioridad'); const n=parseFloat(v); return isNaN(n) ? 999999 : n; })(),
      proceso: (get('proceso') || "SIN PROCESO").toString().trim(),
      producto: get('producto') || "",
      descripcion: get('descripcion') || (get('producto') || "Sin descripción"),
      cantNecesaria: num('cantNecesaria'),
      cantTotal: num('cantTotal'),
      pendiente: num('pendiente'),
      horasTotales: num('horasTotales'),
      avance: num('avance'),
      realiza: get('realiza') || "",
      cliente: get('cliente') || "",
      nOT: get('nOT') || "",
      comentarios: get('comentarios') || ""
    };
  }).filter(r => r.modulo && r.modulo !== "SIN MÓDULO" || r.proceso !== "SIN PROCESO");

  return rows;
}

/* ============================================================
   DATA HELPERS
   ============================================================ */
function statusOf(row){
  if(row.avance >= 1) return "completo";
  if(row.avance > 0) return "progreso";
  return "pendiente";
}
function statusColor(st){
  return st==="completo" ? "var(--green)" : st==="progreso" ? "var(--blue)" : "var(--yellow)";
}
function pct(n){ return Math.round(n*100); }
function esc(s){
  return (s===null||s===undefined?"":s.toString())
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtNum(n){
  if(Math.abs(n - Math.round(n)) < 0.01) return Math.round(n).toString();
  return n.toFixed(1);
}

function getFilteredRows(){
  let rows = rawRows;
  if(ui.proceso !== "__ALL__"){
    rows = rows.filter(r=>r.proceso === ui.proceso);
  }
  if(ui.onlyPending){
    rows = rows.filter(r=>r.avance < 1);
  }
  if(ui.proceso === 'PINTADO' && ui.hideValidated){
    rows = rows.filter(r=>!isValidated(r));
  }
  if(ui.search.trim()){
    const q = ui.search.trim().toLowerCase();
    rows = rows.filter(r=>
      (r.descripcion||"").toLowerCase().includes(q) ||
      (r.producto||"").toLowerCase().includes(q) ||
      (r.cod1||"").toString().toLowerCase().includes(q) ||
      (r.cod2||"").toString().toLowerCase().includes(q) ||
      (r.cliente||"").toLowerCase().includes(q) ||
      (r.nOT||"").toString().toLowerCase().includes(q) ||
      (r.modulo||"").toLowerCase().includes(q)
    );
  }
  return rows;
}

function computeKpis(rows){
  const totalPiezas = rows.length;
  const pendientes = rows.filter(r=>r.avance < 1).length;
  const horasPend = rows.reduce((a,r)=> a + (r.avance<1 ? r.horasTotales*(1-Math.min(r.avance,1)) : 0), 0);
  const necTotal = rows.reduce((a,r)=>a+r.cantNecesaria,0);
  const hechoTotal = rows.reduce((a,r)=>a+Math.min(r.cantTotal, r.cantNecesaria||r.cantTotal),0);
  const avanceGlobal = necTotal>0 ? hechoTotal/necTotal : 0;
  return {totalPiezas, pendientes, horasPend, avanceGlobal};
}

function computeProcesos(){
  const map = {};
  rawRows.forEach(r=>{
    if(!map[r.proceso]) map[r.proceso] = {total:0, pend:0};
    map[r.proceso].total++;
    if(r.avance < 1) map[r.proceso].pend++;
  });
  return Object.keys(map).sort((a,b)=>map[b].pend - map[a].pend).map(k=>({name:k, ...map[k]}));
}

function computeProcesoSummary(proceso){
  const rows = rawRows.filter(r=>r.proceso === proceso);
  const total = rows.length;
  const pend = rows.filter(r=>r.avance<1).length;
  const necTotal = rows.reduce((a,r)=>a+r.cantNecesaria,0);
  const hechoTotal = rows.reduce((a,r)=>a+Math.min(r.cantTotal, r.cantNecesaria||r.cantTotal),0);
  const avance = necTotal>0 ? hechoTotal/necTotal : (total ? rows.reduce((a,r)=>a+Math.min(r.avance,1),0)/total : 0);
  const horasPend = rows.reduce((a,r)=> a + (r.avance<1 ? r.horasTotales*(1-Math.min(r.avance,1)) : 0), 0);
  const horasHechas = rows.reduce((a,r)=> a + r.horasTotales*Math.min(r.avance,1), 0);
  const modulosActivos = new Set(rows.filter(r=>r.avance<1).map(r=>r.modulo)).size;
  return {proceso, total, pend, avance, horasPend, horasHechas, modulosActivos};
}

function groupByModulo(rows){
  const map = {};
  rows.forEach(r=>{
    if(!map[r.modulo]) map[r.modulo] = [];
    map[r.modulo].push(r);
  });
  const groups = Object.keys(map).map(k=>{
    const items = map[k].slice().sort((a,b)=> a.prioridad - b.prioridad);
    const nec = items.reduce((a,r)=>a+r.cantNecesaria,0);
    const hecho = items.reduce((a,r)=>a+Math.min(r.cantTotal, r.cantNecesaria||r.cantTotal),0);
    const avance = nec>0 ? hecho/nec : (items.length ? items.reduce((a,r)=>a+r.avance,0)/items.length : 0);
    const prio = Math.min(...items.map(i=>i.prioridad));
    return {modulo:k, items, avance, prio};
  });
  groups.sort((a,b)=>a.prio - b.prio);
  return groups;
}

async function onConnect(){
  const sheetId = document.getElementById('inp-sheetid').value.trim();
  const sheetName = document.getElementById('inp-sheetname').value.trim() || DEFAULT_SHEET_NAME;
  if(!sheetId){ syncError = "Ingresá el ID de la hoja."; renderSetup(); return; }
  config.sheetId = sheetId;
  config.sheetName = sheetName;
  loading = true; syncError = null; demoMode = false;
  renderSetup();
  try{
    rawRows = await fetchSheet(sheetId, sheetName);
    if(rawRows.length === 0) throw new Error("La hoja se conectó pero no se encontraron filas de datos. Revisá el nombre de la pestaña y los encabezados.");
    lastSync = new Date();
    await saveConfig();
    ui.view = "dashboard";
    render();
    startAutoRefresh();
  }catch(e){
    syncError = e.message || "No se pudo conectar con la hoja.";
    renderSetup();
  }finally{
    loading = false;
  }
}

function onDemo(){
  rawRows = getDemoRows();
  demoMode = true;
  lastSync = new Date();
  ui.view = "dashboard";
  render();
}

  refreshTimer = setInterval(async ()=>{
    try{
      rawRows = await fetchSheet(config.sheetId, config.sheetName);
      lastSync = new Date();
      syncError = null;
    }catch(e){ syncError = e.message; }
    render();
  }, AUTO_REFRESH_MS);
}

async function manualRefresh(){
  if(demoMode){ rawRows = getDemoRows(); lastSync = new Date(); render(); return; }
  loading = true; render();
  try{
    rawRows = await fetchSheet(config.sheetId, config.sheetName);
    lastSync = new Date();
    syncError = null;
  }catch(e){ syncError = e.message; }
  loading = false;
  render();
}

function timeAgo(){
  if(!lastSync) return "";
  const s = Math.round((Date.now()-lastSync.getTime())/1000);
  if(s<60) return "hace " + s + "s";
  const m = Math.round(s/60);
  if(m<60) return "hace " + m + "min";
  const h = Math.round(m/60);
  return "hace " + h + "h";
}

function renderGroups(groups){
  const wrap = document.getElementById('groups-wrap');
  if(groups.length===0){
    wrap.innerHTML = `<div class="empty">No hay piezas que coincidan con el filtro actual.</div>`;

  let budget = ui.visibleCount;
  let html = "";
  for(const g of groups){
    if(budget <= 0) break;
    const items = sortItems(g.items).slice(0, budget);
    budget -= items.length;
    html += `
      <div class="group">
        <div class="group-head">
          <h2>${esc(g.modulo)}</h2>

        </div>
      </div>
    `;

  const totalShown = groups.reduce((a,g)=>a+Math.min(g.items.length, ui.visibleCount),0);
  const totalAll = groups.reduce((a,g)=>a+g.items.length,0);
  wrap.innerHTML = html;

    chk.onchange = (e)=>{

      if(key){ toggleValidatedKey(key); renderProcesoExtra(); renderResultsOnly(); }

function cardHtml(r){
  const st = statusOf(r);
  const stLabel = st==='completo' ? 'Completo' : st==='progreso' ? 'En curso' : 'Pendiente';
  const code = r.cod1 || r.cod2 || r.producto;
  const isPintura = r.proceso === 'PINTADO';
  const validated = isPintura && isValidated(r);
  return `
    <div class="card st-${st}${validated?' st-validated':''}"${isPintura?` data-key="${esc(rowKey(r))}"`:""}>
      <div class="card-top">
        <div class="card-prio"><span class="num">${r.prioridad===999999?'—':r.prioridad}</span> ${esc(r.proceso)}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${isPintura ? `<label class="chk-validado"><input type="checkbox" class="chk-valid" ${validated?"checked":""}> Validado</label>` : ""}
          <div class="card-status ${st}">${stLabel}</div>
        </div>
      </div>
      <div class="card-desc">${esc(r.descripcion)}</div>
      <div class="card-code">${esc(code)}${r.cliente ? " · " + esc(r.cliente) : ""}</div>
      <div class="card-row">
        <div class="card-qty">Necesaria <b>${fmtNum(r.cantNecesaria)}</b> · Hecha <b>${fmtNum(Math.min(r.cantTotal,r.cantNecesaria||r.cantTotal))}</b> · Pend. <b>${fmtNum(Math.max(r.pendiente,0))}</b></div>
        <div class="card-pct" style="color:${statusColor(st)}">${pct(r.avance)}%</div>
      </div>
      <div class="bar"><i style="width:${Math.min(pct(r.avance),100)}%;background:${statusColor(st)};"></i></div>
      <div class="card-foot">
        <span>${r.realiza ? "Realiza: <b>"+esc(r.realiza)+"</b>" : ""}</span>
        <span>${r.nOT ? "OT: <b>"+esc(r.nOT)+"</b>" : ""}${r.horasTotales ? " · "+fmtNum(r.horasTotales)+"h" : ""}</span>
      </div>
    </div>
  `;
}

/* ============================================================
   ROOT RENDER
   ============================================================ */
function render(){
  if(ui.view === 'setup') renderSetup();
  else renderDashboard();
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  loadValidations();
  loadSierraCount();
  await loadConfig();
  render();
  if(config.sheetId){
    loading = true; render();
    try{
      rawRows = await fetchSheet(config.sheetId, config.sheetName);
      lastSync = new Date();
      ui.view = 'dashboard';
      startAutoRefresh();
    }catch(e){
      syncError = e.message;
    }
    loading = false;
    render();
  }
})();

})();
</script>
</body>
</html>
